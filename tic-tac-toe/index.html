<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="scoreboard" aria-label="Scoreboard">
      <div>
        <span class="score-label">X</span>
        <strong id="xScore">0</strong>
      </div>
      <div>
        <span class="score-label">Draws</span>
        <strong id="drawScore">0</strong>
      </div>
      <div>
        <span class="score-label">O</span>
        <strong id="oScore">0</strong>
      </div>
    </section>

    <section class="board-panel" aria-label="Tic tac toe board">
      <div class="status-row">
        <p id="statusText">X to move</p>
        <button id="newRoundButton" type="button">New round</button>
      </div>

      <div id="board" class="board" role="grid" aria-label="Game board">
        <button class="cell" type="button" role="gridcell" aria-label="Cell 1"></button>
        <button class="cell" type="button" role="gridcell" aria-label="Cell 2"></button>
        <button class="cell" type="button" role="gridcell" aria-label="Cell 3"></button>
        <button class="cell" type="button" role="gridcell" aria-label="Cell 4"></button>
        <button class="cell" type="button" role="gridcell" aria-label="Cell 5"></button>
        <button class="cell" type="button" role="gridcell" aria-label="Cell 6"></button>
        <button class="cell" type="button" role="gridcell" aria-label="Cell 7"></button>
        <button class="cell" type="button" role="gridcell" aria-label="Cell 8"></button>
        <button class="cell" type="button" role="gridcell" aria-label="Cell 9"></button>
      </div>
    </section>

    <button id="resetScoresButton" class="reset-button" type="button">Reset scores</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
