<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell" aria-label="Calculator application">
        <section class="calculator" aria-label="Calculator">
            <div class="display" aria-live="polite">
                <div id="history" class="history">&nbsp;</div>
                <output id="display" class="result">0</output>
            </div>

            <div class="keypad">
                <button class="key utility" type="button" data-action="clear" aria-label="Clear">AC</button>
                <button class="key utility" type="button" data-action="delete" aria-label="Delete last digit">⌫</button>
                <button class="key utility" type="button" data-action="percent" aria-label="Percent">%</button>
                <button class="key operator" type="button" data-operator="/" aria-label="Divide">÷</button>

                <button class="key" type="button" data-number="7">7</button>
                <button class="key" type="button" data-number="8">8</button>
                <button class="key" type="button" data-number="9">9</button>
                <button class="key operator" type="button" data-operator="*" aria-label="Multiply">×</button>

                <button class="key" type="button" data-number="4">4</button>
                <button class="key" type="button" data-number="5">5</button>
                <button class="key" type="button" data-number="6">6</button>
                <button class="key operator" type="button" data-operator="-" aria-label="Subtract">−</button>

                <button class="key" type="button" data-number="1">1</button>
                <button class="key" type="button" data-number="2">2</button>
                <button class="key" type="button" data-number="3">3</button>
                <button class="key operator" type="button" data-operator="+" aria-label="Add">+</button>

                <button class="key zero" type="button" data-number="0">0</button>
                <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
                <button class="key equals" type="button" data-action="equals" aria-label="Equals">=</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
